<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin | Luzio Garage Trading</title><link rel="stylesheet" href="styles.css"><script src="admin.js" defer></script></head><body><header><a class="identity" href="/">LUZIO GARAGE</a><a href="/">← View website</a><button id="logout" class="button" hidden>LOG OUT</button></header><main class="section"><p class="eyebrow">GARAGE MANAGEMENT</p><h1 style="font-size:60px">Admin dashboard.</h1><p id="admin-message" role="status" aria-live="polite"></p><section id="auth-panel" hidden><h2 id="auth-title">Admin login</h2><form id="auth-form" class="form-grid"><label id="code-label" hidden>Setup code from your server terminal<input name="code" autocomplete="off"></label><label>Password<input name="password" type="password" required maxlength="200" autocomplete="current-password"></label><div class="full"><button class="button">CONTINUE →</button></div></form></section><div id="dashboard" hidden><section><div class="section-head"><h2>Motorcycles</h2><button class="button" id="new-unit">ADD UNIT +</button></div><p>No photos needed. Add the unit details now and update them later.</p><div id="admin-units"></div></section><section style="margin-top:70px"><div class="section-head"><h2>Inquiry inbox</h2><button class="button" id="refresh-inbox">REFRESH</button></div><div id="inbox"></div></section></div><dialog id="unit-editor" class="unit-dialog"><button class="close-dialog" type="button" aria-label="Close editor">×</button><h2 id="editor-title">Add motorcycle</h2><form id="unit-form" class="form-grid"><input name="id" type="hidden"><label>Model name<input name="name" required maxlength="100"></label><label>Brand<input name="brand" required maxlength="60"></label><label>Type<input name="type" placeholder="Naked, sport, scooter…" required maxlength="60"></label><label>Model year<input name="year" type="number" min="1900" required></label><label>Price (₱)<input name="price" type="number" min="0" max="100000000" step="1" required></label><label>Mileage (km)<input name="mileage" type="number" min="0" max="10000000" step="1" required></label><label>Status<select name="status"><option value="available">Available</option><option value="reserved">Reserved</option><option value="sold">Sold</option></select></label><label class="full">Description<textarea name="description" rows="4" maxlength="3000"></textarea></label><p id="editor-message" class="full" role="status"></p><div class="full"><button class="button" type="submit">SAVE UNIT →</button></div></form></dialog></main></body></html>
